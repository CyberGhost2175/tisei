services:
  postgres:
    image: postgres:16-alpine
    container_name: tisei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tisei
      POSTGRES_PASSWORD: tisei
      POSTGRES_DB: tisei
    ports:
      - "5432:5432"
    volumes:
      - tisei_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tisei"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tisei-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - tisei_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for local development (attachments)
  minio:
    image: minio/minio:latest
    container_name: tisei-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tisei_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tisei_pgdata:
  tisei_redisdata:
  tisei_miniodata:
